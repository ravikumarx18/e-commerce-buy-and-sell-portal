<body>

<header>

                                </div>

                                <ul class="contact-now">
                                    <li>+91-9876543210</li>
                                </ul>
                            </div>

                            <div class="header-info-right">
                                <ul>
                                    <li>
                                        <a href="{{ url_for('logout') }}">
                                            Logout({{ session['username'] }})
                                        </a>
                                    </li>

                                    <li>
                                        <a href="{{ url_for('vendororderhistory') }}">
                                            Order History
                                        </a>
                                    </li>

                                    <li>
                                        <a href="{{ url_for('allProduct') }}">
                                            All Products
                                        </a>
                                    </li>
                                </ul>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <div class="header-bottom header-sticky">
                <div class="container-fluid">
                    <div class="row align-items-center">

                        <!-- Logo -->
                        <div class="col-xl-1 col-lg-1 col-md-1 col-sm-3">
                            <div class="logo">
                                <a href="{{ url_for('home') }}">
                                    <img src="{{ url_for('static', filename='img/logo/logo.png') }}" alt="">
                                </a>
                            </div>
                        </div>

                        <div class="col-xl-7 col-lg-8 col-md-7 col-sm-5">
                            <div class="main-menu f-right d-none d-lg-block">
                                <nav>
                                    <ul id="navigation">

                                        <li>
                                            <a href="{{ url_for('addProduct') }}">
                                                Add Product
                                            </a>
                                        </li>

                                        <li>
                                            <a href="{{ url_for('myProduct') }}">
                                                My Products
                                            </a>
                                        </li>

                                        <li>
                                            <a href="{{ url_for('myOrder') }}">
                                                New Orders
                                            </a>
                                        </li>

                                        <li>
                                            <a href="{{ url_for('notifications') }}">
                                                Notifications
                                            </a>

                                    </ul>
                                </nav>
                            </div>

                        <!-- Mobile Menu -->

                            <div class="mobile_menu d-block d-lg-none"></div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</header>


<!-- Slider Area -->
<div class="slider-area">

    <div class="single-slider slider-height2 d-flex align-items-center"
         data-background="{{ url_for('static', filename='img/hero/category.jpg') }}">

        <div class="container">

            <div class="row">

                <div class="col-xl-12">

                    <div class="hero-cap text-center">
                        <h2>Add New Product</h2>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Add Product Form -->

<div class="container">

    <div class="single-slider slider-height2 d-flex align-items-center">

        <div class="col-lg-8 col-md-8">

            <br><br><br><br>

            <form action="{{ url_for('addProduct') }}"
                  method="POST"
                  enctype="multipart/form-data">

                <!-- Product Name -->

                <div class="mt-10">

                    <h6>Product Name</h6>

                    <input
                        type="text"
                        name="pname"
                        placeholder="Product Name"
                        onfocus="this.placeholder = ''"
                        onblur="this.placeholder = 'Product Name'"
                        required
                        class="single-input border">

                </div>


                <!-- Product Description -->

                <div class="mt-10">

                    <br>

                    <h6>Product Description</h6>

                    <textarea
                        class="single-textarea border"
                        name="pdetails"
                        placeholder="Product Details"
                        onfocus="this.placeholder = ''"
                        onblur="this.placeholder = 'Product Details'"
                        required></textarea>

                </div>


                <!-- Price -->

                <div class="mt-10">

                    <br>

                    <h6>Price</h6>

                    <input
                        type="text"
                        name="price"
                        placeholder="Price"
                        onfocus="this.placeholder = ''"
                        onblur="this.placeholder = 'Price'"
                        required
                        class="single-input border">

                </div>


                <!-- Discount Price -->

                <div class="mt-10">

                    <br>

                    <h6>Discount Price</h6>

                    <input
                        type="text"
                        name="disprice"
                        placeholder="Discount Price"
                        onfocus="this.placeholder = ''"
                        onblur="this.placeholder = 'Discount Price'"
                        required
                        class="single-input border">

                </div>


                <!-- Category -->

                <div class="single-element-widget mt-10">

                    <br>

                    <h6>Category</h6>

                    <div class="form-select border">

                        <select name="category">

                            <option value="pantry">
                                Pantry
                            </option>

                            <option value="clothing">
                                Clothing
                            </option>

                            <option value="homedecor">
                                Homedecor
                            </option>

                            <option value="watches">
                                Watches
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Stock -->

                <div class="mt-10">

                    <br>

                    <h6>Stock</h6>

                    <input
                        type="number"
                        name="stock"
                        placeholder="Stock"
                        onfocus="this.placeholder = ''"
                        onblur="this.placeholder = 'Stock'"
                        required
                        class="single-input border">

                </div>


                <!-- Product Picture -->

                <div class="card-body"
                     style="margin-right: 180px; margin-top: 50px;">

                    <h6>Product Picture</h6>

                    <input
                        type="file"
                        name="file">

                </div>


                <!-- Submit -->

                <div class="button-group-area mt-10">

                    <button
                        type="submit"
                        class="genric-btn primary circle arrow large">

                        Add Product

                        <span class="lnr lnr-arrow-right"></span>

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- Footer -->

<footer>

    <div class="footer-area footer-padding">

        <div class="container">

            <div class="row d-flex justify-content-between">

                <div class="col-xl-3 col-lg-3 col-md-5 col-sm-6">

                    <div class="single-footer-caption mb-50">

                        <div class="single-footer-caption mb-30">

                            <div class="footer-logo">

                                <a href="{{ url_for('home') }}">

                                        alt="">

                                </a>

                            </div>

                            <div class="footer-tittle">

                                <div class="footer-pera">

                                    <p>
                                        The one stop online destination
                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</footer>
